<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Orders</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="container">
    <h1>Order Dashboard</h1>
    <p>WebSocket Status: <span id="ws-status" class="offline">Disconnected</span></p>

    <form id="order-form">
      <input type="text" id="name" placeholder="Product Name" required />
      <input type="number" id="price" placeholder="Price (R)" step="0.01" required />
      <input type="number" id="quantity" placeholder="Qty" min="1" value="1" required />
      <button type="submit">Send Order</button>
    </form>

    <h2>Live Orders</h2>
    <table>
      <thead>
        <tr>
          <th>Order ID</th>
          <th>Products</th>
          <th>Qty</th>
          <th>Total</th>
          <th>Status</th>
          <th>Purchased At</th>
        </tr>
      </thead>
      <tbody id="orders-body"></tbody>
    </table>
  </div>

  <script src="./script.js"></script>
</body>
</html>
